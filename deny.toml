# cargo-deny 配置：安全公告 + 许可证合规
[advisories]
version = 2
yanked = "deny"
# unmaintained 直接关闭：树上有一批无人维护的传递依赖（现存 number_prefix、
# paste 等；backoff/instant/rand_os 已随依赖升级消失），逐条维护这份名单只会反复
# 漂移。这不影响安全结论：真正可利用的漏洞仍由 [advisories] 拦截，只有显式 ignore
# 才放行。
unmaintained = "none"
# ignore 只写「上游确实没有修复版」的条目，并写清影响面与跟踪条件。
# cargo-deny 每次运行都会对**没有命中任何 crate** 的条目报
# `warning[advisory-not-detected]`——出现该警告说明对应的传递依赖已被升级掉，
# 该条目应当删除（RUSTSEC-2026-0098/0099/0104 就是这样在 embed_anything 升到
# 0.7.1、rustls-webpki 从 0.101 升到 0.103 之后失效并被移除的）。
# - RUSTSEC-2026-0187: lopdf 解析深层 PDF 对象时栈溢出；pdf-extract 0.9.0 钉死
#   lopdf 0.36，0.42+ 不可达。SoulMem 不解析不可信 PDF。
# - RUSTSEC-2023-0071: rsa crate Marvin Attack（时序侧信道，CVSS 7.4）。
#   经 jsonwebtoken 10.4.0 ← surrealdb 链传递引入；rsa 上游 patched=[] 自 2023
#   年至今无修复版（最新 0.9.10 仍受影响，0.10 尚在 rc）。影响面：攻击者可观测
#   时序时恢复私钥。SoulMem 仅在本地/可信环境使用 SurrealDB 嵌入式存储，
#   不暴露给可观测时序的网络攻击者，故忽略并跟踪上游修复。
ignore = [
    "RUSTSEC-2026-0187",
    "RUSTSEC-2023-0071",
]

[bans]
multiple-versions = "warn"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "NCSA",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    # surrealdb 3.x 为 BUSL-1.1（非 OSI 许可）：Additional Use Grant 仅禁止用作
    # "Database Service"（向第三方提供数据库功能）；soul-mem-runtime 以嵌入式
    # kv-mem/kv-surrealkv 本地使用，落在授权内，无需商业许可。Change Date
    # 2030-01-01 后转 Apache-2.0。
    "BUSL-1.1",
]
