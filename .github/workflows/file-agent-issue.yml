name: File agent issue

# 审阅 agent 提交 issue 的唯一入口：作者是 github-actions[bot]，不是维护者。
# agent 的结论尚未核实——用维护者的身份发出去，读者会默认它已经被维护者确认过。
#
# 为什么不直接让 agent 跑 `gh issue create`：agent 拿的是维护者凭据，署名必然是维护者。
# 为什么不另建 machine account 或 GitHub App：这条路零账号、零额外 secret。
#
# 两个必须知道的约束：
#   1. `workflow_dispatch` 只在 workflow 文件已存在于**默认分支**（main）后可触发。本仓库的
#      main 只接受来自 dev 的 PR，所以本文件要随 dev → main 的同步 PR 合上去才能真正建单，
#      在那之前 `gh workflow run` 会报找不到 workflow。
#   2. GITHUB_TOKEN 触发的事件不会再启动新 workflow。因此标签与重复检查都必须在本文
#      件内完成，不能指望另一个 `on: issues` 的 workflow 来补。
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Issue 标题"
        required: true
        type: string
      body:
        description: "Issue 正文；短报告内联写这里，与 report_path 二选一"
        required: false
        type: string
      report_ref:
        description: "长报告所在的分支或 tag；与 report_path 配对使用"
        required: false
        type: string
      report_path:
        description: "长报告在仓库内的路径；给了它就改用文件内容，忽略 body"
        required: false
        type: string
      labels:
        description: "逗号分隔的标签；必须已存在，否则建单失败"
        required: false
        default: "agent-report"
        type: string

permissions:
  contents: read
  issues: write

env:
  # 内联路径下没有 checkout，gh 无法从本地 remote 推断仓库，必须显式给出。
  GH_REPO: ${{ github.repository }}
  ATTRIBUTION: "> 🤖 本 issue 由审阅 agent 自动提交，结论**未经维护者核实**，不代表维护者判断。"

jobs:
  file:
    name: File issue
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout report ref
        if: inputs.report_ref != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.report_ref }}
          fetch-depth: 1
          persist-credentials: false

      # 正文先落文件再交给 `gh --body-file`：审阅报告可达数十 KB，走命令行参数会同时撞上
      # 参数长度上限与 shell 转义两个问题。外部输入一律只经 env 传入，不插进 `run` 模板，
      # 免得正文里的反引号或 `$()` 被当成命令执行。
      - name: Assemble body
        env:
          INLINE_BODY: ${{ inputs.body }}
          REPORT_PATH: ${{ inputs.report_path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/body.md"
          printf '%s\n\n---\n\n' "$ATTRIBUTION" > "$body"
          if [ -n "$REPORT_PATH" ]; then
            if [ ! -f "$REPORT_PATH" ]; then
              echo "::error::report_path 不存在：$REPORT_PATH（report_ref 选对了吗？）"
              exit 1
            fi
            cat "$REPORT_PATH" >> "$body"
          elif [ -n "$INLINE_BODY" ]; then
            printf '%s\n' "$INLINE_BODY" >> "$body"
          else
            echo "::error::必须给出 body，或同时给出 report_ref 与 report_path"
            exit 1
          fi
          printf '\n\n---\n\n<sub>提交方式：[File agent issue run](%s)</sub>\n' "$RUN_URL" >> "$body"

      # 同标题的开放 issue 直接拒绝，不静默跳过：agent 反复审阅同一份代码时最容易重复开单，
      # 而重复单正是「追踪不方便」的来源。只比对 open —— 已修好并关闭的问题复发时应当重开。
      - name: Reject duplicate title
        env:
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          if ! gh issue list --state open --limit 200 --search "$TITLE in:title" \
               --json number,title > "$RUNNER_TEMP/open.json"; then
            echo "::warning::重复标题检查未能执行（搜索请求失败），继续建单"
            exit 0
          fi
          dup=$(jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty' \
            "$RUNNER_TEMP/open.json" 2>/dev/null || true)
          if [ -n "$dup" ]; then
            echo "::error::已存在同标题的开放 issue #$dup：$TITLE"
            exit 1
          fi

      - name: Create issue
        env:
          TITLE: ${{ inputs.title }}
          LABELS: ${{ inputs.labels }}
        run: |
          set -euo pipefail
          args=(--title "$TITLE" --body-file "$RUNNER_TEMP/body.md")
          IFS=',' read -ra wanted <<< "$LABELS"
          for raw in "${wanted[@]}"; do
            name=$(printf '%s' "$raw" | xargs)
            if [ -n "$name" ]; then
              args+=(--label "$name")
            fi
          done
          url=$(gh issue create "${args[@]}")
          echo "ISSUE_URL=$url"
          {
            echo "### 已创建 issue"
            echo
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
