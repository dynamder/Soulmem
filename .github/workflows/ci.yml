name: CI

# 主题分支的 push 不再触发：此前 `push:` 没有分支过滤，任何分支每推一次都会跑
# 三平台全量测试。现在只在两条长期分支的 push 与所有 PR 上运行。
on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # 文档分类要读区间内的改动文件，浅克隆拿不到区间历史（仓库约 37 MiB，代价可忽略）。
          fetch-depth: 0

      # 纯文档改动无法影响编译或测试，没必要付三平台全量测试的时间：先分类，再决定下面的
      # 重步骤跑不跑。
      #
      # 为什么必须留在 **job 内、用步骤级 if**，而不能给 job 加 `if`，也不能给
      # `on.pull_request` 加 `paths-ignore`：
      #   - workflow 级路径过滤会让必需检查根本不被创建，PR 永久停在 "Expected — Waiting"；
      #   - **job 级 `if` 在 matrix 展开之前求值**：被跳过时只上报未插值的模板名
      #     `Test (${{ matrix.os }})`，而分支保护要的是 `Test (ubuntu-latest)` 等三个具体
      #     名字——它们永远不会被创建，同样死锁。
      # 步骤级跳过不影响 job 自身完成，三个名字照常上报。
      #
      # 输出只有三种可能：`false`（改动全是文档 → 跳过重步骤）、`true`（有代码改动 → 全跑）、
      # 空（非 PR 事件，或本步骤被跳过 → 全跑）。条件写成 `!= 'false'` 是为了让最后一种
      # 落到"全跑"，fail-safe。
      #
      # 这里**不要**写成 `>> "$GITHUB_OUTPUT"`：Windows 上 Python 以文本模式写 stdout 会把
      # `\n` 变成 `\r\n`，尾随的 CR 混进输出值后 `!= 'false'` 就不再成立，重步骤会在最贵的
      # 那个平台上照跑（首版实测：ubuntu 5s / macos 8s 跳过，windows 编译并跑完测试）。
      # 脚本自己以显式 LF 写输出文件，屏蔽掉这个平台差异。
      - name: Classify changed paths
        id: classify
        if: github.event_name == 'pull_request'
        run: python3 scripts/classify_changes.py "${{ github.event.pull_request.base.sha }}..${{ github.sha }}"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.classify.outputs.code != 'false'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.classify.outputs.code != 'false'

      # bge-small-zh 模型在测试时由 hf-hub 下载，缓存避免三平台重复下载。
      - name: Cache embedding model
        if: steps.classify.outputs.code != 'false'
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-zh

      - name: Build all targets
        if: steps.classify.outputs.code != 'false'
        run: cargo build --workspace --all-targets

      - name: Run tests
        if: steps.classify.outputs.code != 'false'
        run: cargo test --workspace

  quality:
    name: Quality (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # 提交信息门禁要沿 PR 范围回溯（base.sha..head），默认的浅克隆拿不到区间历史。
          # 只有 quality 这一个 job 需要完整历史，其余 job 保持默认。
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 三个纯文本门禁放在最前面：不需要工具链、秒级返回，而且——关键——它们必须在
      # `cargo fmt` 之前运行。此前它们排在 fmt 之后，于是 fmt 一红这两步就被 skip，
      # 门禁等于没装（正是这条注释原本想表达的意思，但位置写错了）。
      #
      # 中文注释被 GBK 保存会变成乱码且部分字节永久丢失（memory_cluster.rs 曾丢 16 行）。
      - name: Check text encoding
        run: python3 scripts/check_encoding.py

      # 模块布局约定：一律 xxx.rs + xxx/，禁止 mod.rs。
      - name: Check module layout
        run: python3 scripts/check_layout.py

      # 提交信息：Conventional Commits，只查本次 PR 新增提交的首行（docs/dev-convention.md §2）。
      #
      # 只在「目标分支是 dev」的 PR 上跑。dev → main 的 release PR 会把 dev 上成百个历史
      # 提交一起带进范围，其中包含规范生效前的旧写法——那批历史按约定**不追溯、不重写**，
      # 在 release PR 上重跑只会制造一批无解的假红。
      - name: Check commit messages
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev'
        env:
          COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.sha }}
        run: python3 scripts/check_commit_messages.py "$COMMIT_RANGE"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  security:
    name: Security (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace
