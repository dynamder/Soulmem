name: 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能解决什么痛点？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望的行为或实现思路。
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 替代方案
      description: 你考虑过哪些替代做法？
