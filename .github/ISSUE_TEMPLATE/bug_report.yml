name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 清楚描述你遇到的问题。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？
      placeholder: |
        1. 执行 ...
        2. 观察 ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统 / Rust 版本 / 分支
      placeholder: Windows 11 / rustc 1.97 / dev
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 相关的错误输出或截图。
*** Add File: .github/ISSUE_TEMPLATE/feature_request.yml
name: 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能解决什么痛点？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望的行为或实现思路。
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 替代方案
      description: 你考虑过哪些替代做法？
