[workspace]
resolver = "3"
members = ["crates/soul-mem-algo","crates/soul-mem-core", "crates/soul-mem-query", "crates/soul-mem-runtime", "benches", "crates/soul-tune", "crates/soul-tune-api"]

# esaxx-rs 硬编码 static_crt(true)(/MT)，与 llama-cpp-sys-2(/MD) 在 MSVC 链接冲突，
# 本地补丁移除 static_crt 使整个依赖树统一使用 /MD 运行时。
[patch.crates-io]
esaxx-rs = { path = "patches/esaxx-rs" }

[workspace.dependencies]
anyhow = "1.0.98"
chrono = { version = "0.4.41", features = ["serde"] }
petgraph = "0.8.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["full"] }
uuid = { version = "1.17.0", features = ["serde", "v4"] }
async-trait = "0.1.88"
thiserror = "2.0.17"
insta = { version = "1", features = ["yaml"] }
candle-core = "=0.11.0"
candle-transformers = "=0.11.0"
candle-nn = "=0.11.0"

jieba-rs = "0.8"
dashmap = "6.2.1"
rand = "0.9"
parking_lot = "0.12"
async-openai = { version = "0.32.4", features = ["chat-completion"] }
dotenvy = "0.15"

[profile.release]
lto = true
strip = true
opt-level = 3
codegen-units = 1
# 注意：不使用 panic='abort'。FRB（crates/soul-tune-api）跨 FFI 需要 unwinding，
# 且 panic 不允许在 per-package profile 覆盖，故全局保持默认 unwind。
