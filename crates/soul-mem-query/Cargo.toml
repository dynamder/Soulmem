[package]
name = "soul-mem-query"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }

anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
candle-core = { workspace = true }
embed_anything = "0.7.1"
rayon = "1.10.0"
text-splitter = "0.29.3"
strsim = "0.11.1"
hotpath = { workspace = true }

soul-mem-core = {path = "../soul-mem-core"}

# 剖析插桩开关（与 soul-mem-algo 同约定）：默认关闭零开销，
# 开启后测量 embedding 计算链（cosine/字符串距离/匿名打分）耗时。
[features]
default = []
hotpath = ["hotpath/hotpath"]

[dev-dependencies]
tokio = { workspace = true }
