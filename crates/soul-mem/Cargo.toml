[package]
name = "soul-mem"
version = "0.1.0"
edition = "2024"
publish = false
description = "SoulMem 运行时记忆服务：zenoh pub/sub 与 gRPC 共用一份 protobuf 协议"
license = "MIT"

[dependencies]
soul-mem-core = { path = "../soul-mem-core" }
soul-mem-query = { path = "../soul-mem-query" }
soul-mem-runtime = { path = "../soul-mem-runtime" }
soul-mem-algo = { path = "../soul-mem-algo" }
soul-mem-llm = { path = "../soul-mem-llm" }

anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
futures.workspace = true
dotenvy.workspace = true
async-stream = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
zenoh = "1"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
