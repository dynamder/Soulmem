exclude_globs = ["**/embedding_model/**"]
additional_cargo_test_args = ["--", "--skip", "test_bge_small_zh_cpu", "--skip", "test_qwen3_embedding_600m_cpu"]
exclude_re = [
    'replace \|\| with && in string_distance_score',
    'LlmClient::call_llm',
    'LlmClient::simple_call',
    'SlidingWindow::summarize',
    'Config for LLMConfig>::query',
    'replace match guard .* in MemoryCluster::merge_node',
    'replace / with \* in naive_ppr',
    'weighted_ppr_fp',
    'in weighted_ppr_fp',
    'UnitMeasure for OrdFloat<F>>::zero',
    'from struct AssociationConfig expression',
    # PPR 内部比较算子：ResidueUnit 为私有类型，EdgeWeightUnit 为内部表示，
    # 算法通过 Iterator::max()（Ord::cmp）使用它们，公开行为已由 PPR 输出测试覆盖；
    # PartialOrd/PartialEq 各算子未被算法直接使用，为其逐个写断言属于针对变异体的过度拟合。
    # 注：Ord::cmp 仍由 PPR 输出测试覆盖，故不在排除之列。
    'PartialOrd for ResidueUnit',
    'PartialEq for ResidueUnit',
    'PartialOrd for EdgeWeightUnit',
    'PartialEq for EdgeWeightUnit',
]
